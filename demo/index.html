<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pipeline Stages — Donor Network</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
  :root {
    --ink: #1c2521; --paper: #f6f4ee; --panel: #ffffff; --line: #d8d3c4;
    --accent: #2e5c4a; --accent-soft: #9fc4b3; --warn: #b5553a;
    --evidence: #7a6a52;
    --mono: 'IBM Plex Mono', Consolas, monospace;
    --sans: -apple-system, 'Segoe UI', sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); height: 100%; }

  .app { display: flex; flex-direction: column; height: 100vh; min-height: 640px; }

  .topbar {
    display: flex; align-items: center; gap: 0;
    border-bottom: 1px solid var(--ink);
    background: var(--panel);
    padding: 0 16px;
  }
  .step {
    flex: 1; padding: 14px 10px; text-align: center; cursor: pointer;
    border-right: 1px solid var(--line);
    position: relative;
  }
  .step:last-child { border-right: none; }
  .step .num {
    font-family: var(--mono); font-size: 10px; color: #8a9189;
  }
  .step .lbl { font-size: 12.5px; font-weight: 600; margin-top: 2px; }
  .step.active .num { color: var(--accent); }
  .step.active { background: #eef0e8; }
  .step.active::after {
    content: ''; position: absolute; bottom: -1px; left: 0; right: 0; height: 2px; background: var(--accent);
  }
  .step .sub { font-size: 10px; color: #8a9189; font-family: var(--mono); margin-top: 3px; }

  .body { flex: 1; display: grid; grid-template-columns: 1fr 280px; min-height: 0; }

  .stage { position: relative; background: radial-gradient(circle at 1px 1px, #00000014 1px, transparent 0) 0 0/22px 22px, var(--paper); }
  svg { width: 100%; height: 100%; display: block; }

  .stage-caption {
    position: absolute; top: 14px; left: 18px; right: 320px;
    font-size: 12px; line-height: 1.5; color: #3d453f;
    background: rgba(246,244,238,0.9); padding: 8px 12px; border-radius: 4px;
    border-left: 3px solid var(--accent);
    max-width: 460px;
  }
  .stage-caption.warn { border-left-color: var(--warn); }

  .weight-toggle {
    position: absolute; top: 14px; right: 16px;
    display: flex; border: 1px solid var(--ink); border-radius: 3px; overflow: hidden;
  }
  .weight-toggle button {
    padding: 6px 10px; border: none; background: var(--panel);
    font-family: var(--mono); font-size: 10px; cursor: pointer; color: var(--ink);
    border-right: 1px solid var(--ink);
  }
  .weight-toggle button:last-child { border-right: none; }
  .weight-toggle button.active { background: var(--ink); color: var(--paper); }

  .node text { font-family: var(--mono); font-size: 9px; fill: var(--ink); pointer-events: none; }
  .evnode text { font-family: var(--mono); font-size: 8.5px; fill: var(--evidence); pointer-events: none; }
  .link { stroke: var(--accent); }
  .link.dup { stroke: var(--warn); stroke-dasharray: 3 2; }
  .biplink { stroke: #b3ab98; stroke-width: 1; }

  .inspector { border-left: 1px solid var(--line); padding: 18px 15px; overflow-y: auto; background: var(--panel); font-size: 12px; }
  .inspector h2 { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); margin: 0 0 12px; }
  .placeholder { color: #8a9189; font-size: 12px; line-height: 1.5; }
  .stat-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 11.5px; }
  .stat-row .val { font-family: var(--mono); font-weight: 600; }
  .card { border: 1px solid var(--line); border-radius: 4px; padding: 9px 11px; margin-bottom: 9px; }
  .card .pair { font-weight: 600; font-size: 12px; margin-bottom: 4px; }
  .card .conf { font-family: var(--mono); font-size: 17px; color: var(--accent); }
  .tag { display: inline-block; font-family: var(--mono); font-size: 9.5px; background: #eef0e8; border: 1px solid var(--line); border-radius: 9px; padding: 1px 6px; margin: 2px 3px 0 0; }
  .tag.merged { background: #e2ede7; border-color: var(--accent); color: var(--accent); }
  .tag.dup { background: #f6ebe6; border-color: var(--warn); color: var(--warn); }

  /* ---- Poster-style Edge Details card ---- */
  .ed-card { border: 1px solid var(--line); border-radius: 6px; padding: 14px 15px; }
  .ed-card h3 { font-size: 13px; margin: 0 0 12px; }
  .ed-field { margin-bottom: 10px; }
  .ed-field .k { font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: #8a9189; margin-bottom: 2px; }
  .ed-field .v { font-size: 13px; font-weight: 600; }
  .ed-bullets { margin: 3px 0 0; padding-left: 16px; font-size: 12px; line-height: 1.7; }
  .ed-conf-val { font-family: var(--mono); font-size: 26px; font-weight: 700; color: var(--accent); }
  .ed-empty { text-align: center; color: #8a9189; padding: 30px 10px; font-size: 12px; line-height: 1.6; }

  .conf-filter { position: absolute; bottom: 16px; left: 18px; right: 320px; max-width: 460px;
    background: rgba(255,255,255,0.92); border: 1px solid var(--line); border-radius: 5px; padding: 8px 12px; }
  .conf-filter .row { display: flex; align-items: center; gap: 10px; font-size: 11px; font-family: var(--mono); }
  .conf-filter input[type=range] { flex: 1; accent-color: var(--accent); }

  .edge-label { font-family: var(--mono); font-size: 9.5px; fill: var(--ink); font-weight: 700; paint-order: stroke; stroke: var(--paper); stroke-width: 3px; }
  .edge-label-evidence { font-size: 8.5px; font-weight: 500; fill: var(--evidence); }
  .node .donor-id { font-family: var(--mono); font-size: 8px; fill: #6b756f; }
</style>
</head>
<body>
<div class="app">
  <div class="topbar" id="topbar"></div>
  <div class="body">
    <div class="stage">
      <div class="stage-caption" id="caption"></div>
      <div class="weight-toggle" id="weight-toggle" style="display:none;">
        <button id="btn-naive">naive</button>
        <button id="btn-weighted" class="active">weighted</button>
      </div>
      <div class="conf-filter" id="conf-filter" style="display:none;">
        <div class="row">
          <span>min confidence</span>
          <input type="range" id="conf-slider" min="0" max="1" step="0.01" value="0.7">
          <span id="conf-slider-val">0.70</span>
        </div>
      </div>
      <svg id="graph"></svg>
    </div>
    <div class="inspector">
      <h2 id="insp-title">Stage stats</h2>
      <div id="stats"></div>
      <div id="inspector-body" class="placeholder" style="margin-top:14px;">Click a node or edge for details.</div>
    </div>
  </div>
</div>

<script>
const D = window.__STAGES__;
let stage = 1;
let weightMode = 'weighted';
let simulation;

const svg = d3.select('#graph');
const stageInfo = [
  { n: 1, label: 'Initial graph', sub: 'raw extraction' },
  { n: 2, label: 'After deduplication', sub: 'Warehouse' },
  { n: 3, label: 'After Routing', sub: 'evidence-based' },
  { n: 4, label: 'After Confidence', sub: 'weighted edges' },
];

function renderTopbar() {
  const bar = document.getElementById('topbar');
  bar.innerHTML = '';
  stageInfo.forEach(s => {
    const el = document.createElement('div');
    el.className = 'step' + (s.n === stage ? ' active' : '');
    el.innerHTML = `<div class="num">STAGE ${s.n}</div><div class="lbl">${s.label}</div><div class="sub">${s.sub}</div>`;
    el.onclick = () => { stage = s.n; render(); };
    bar.appendChild(el);
  });
}

function tierColor(tier) { return { major: '#2e5c4a', mid: '#7a9c8a', annual: '#c7d3c9' }[tier] || '#c7d3c9'; }

// poster-style pastel palette, assigned per-donor so each node reads distinctly
const POSTER_PALETTE = ['#8fbf9f', '#b39ddb', '#ffb74d', '#ef9a9a', '#4db6ac', '#fff59d', '#90caf9', '#f48fb1'];
const donorColor = {};
Object.keys(D.donors).forEach((id, i) => { donorColor[id] = POSTER_PALETTE[i % POSTER_PALETTE.length]; });

function clearSvg() {
  svg.selectAll('*').remove();
  if (simulation) simulation.stop();
}

function setupZoom() {
  const container = svg.append('g');
  svg.call(d3.zoom().scaleExtent([0.3, 4]).on('zoom', ev => container.attr('transform', ev.transform)));
  return container;
}

function bbox() {
  const r = document.querySelector('.stage').getBoundingClientRect();
  return { width: r.width, height: r.height };
}

// ---------- Stage 1 & 2: bipartite donor <-> evidence ----------
function renderBipartite(stageKey, caption, captionClass) {
  const s = D[stageKey];
  const { width, height } = bbox();
  clearSvg();
  document.getElementById('caption').className = 'stage-caption' + (captionClass ? ' ' + captionClass : '');
  document.getElementById('caption').innerHTML = caption;
  document.getElementById('weight-toggle').style.display = 'none';

  const donorNodes = Object.values(D.donors).map(d => ({ ...d, kind: 'donor' }));
  const evNodes = s.evidence_nodes.map(e => ({ ...e, kind: 'evidence', id: e.id }));
  const allNodes = [...donorNodes, ...evNodes];
  const links = s.donor_edges.map(l => ({ source: l.donor, target: l.evidence }));

  document.getElementById('stats').innerHTML = `
    <div class="stat-row"><span>Donors</span><span class="val">${donorNodes.length}</span></div>
    <div class="stat-row"><span>Evidence nodes</span><span class="val">${evNodes.length}</span></div>
    <div class="stat-row"><span>Donor-evidence edges</span><span class="val">${links.length}</span></div>
  `;

  const container = setupZoom();
  const linkSel = container.append('g').selectAll('line').data(links).join('line').attr('class', 'biplink');
  const nodeSel = container.append('g').selectAll('g').data(allNodes).join('g').attr('class', d => d.kind === 'donor' ? 'node' : 'node evnode').call(drag());

  nodeSel.append('rect')
    .filter(d => d.kind === 'evidence')
    .attr('width', d => 8 + (d.donor_count || 1) * 2.2)
    .attr('height', d => 8 + (d.donor_count || 1) * 2.2)
    .attr('x', d => -(4 + (d.donor_count || 1) * 1.1))
    .attr('y', d => -(4 + (d.donor_count || 1) * 1.1))
    .attr('fill', d => d.was_merged ? '#cfe0d5' : '#efe9db')
    .attr('stroke', d => d.was_merged ? 'var(--accent)' : '#b3ab98')
    .attr('stroke-width', 1.1)
    .style('cursor', 'pointer')
    .on('click', (ev, d) => showEvidence(d));

  nodeSel.append('circle')
    .filter(d => d.kind === 'donor')
    .attr('r', 5)
    .attr('fill', d => tierColor(d.tier))
    .attr('stroke', 'var(--ink)').attr('stroke-width', 1)
    .style('cursor', 'pointer')
    .on('click', (ev, d) => showDonorBipartite(d, links, evNodes));

  nodeSel.append('text').attr('dx', 8).attr('dy', 3)
    .text(d => d.kind === 'donor' ? d.name.split(' ')[0] : d.name);

  simulation = d3.forceSimulation(allNodes)
    .force('link', d3.forceLink(links).id(d => d.id).distance(d => 40).strength(0.5))
    .force('charge', d3.forceManyBody().strength(d => d.kind === 'evidence' ? -130 : -40))
    .force('center', d3.forceCenter(width / 2, height / 2))
    .force('x', d3.forceX(width / 2).strength(0.04))
    .force('y', d3.forceY(height / 2).strength(0.04))
    .force('collide', d3.forceCollide().radius(d => d.kind === 'evidence' ? 10 + (d.donor_count||1)*1.1 : 8))
    .on('tick', () => {
      linkSel.attr('x1', d => d.source.x).attr('y1', d => d.source.y).attr('x2', d => d.target.x).attr('y2', d => d.target.y);
      nodeSel.attr('transform', d => `translate(${d.x},${d.y})`);
    });
}

function showEvidence(d) {
  const merged = d.merged_from ? `<div style="margin-top:6px;">${d.merged_from.map(n => `<span class="tag merged">${n}</span>`).join('')}</div>` : '';
  document.getElementById('inspector-body').innerHTML = `
    <div class="card">
      <div class="pair">${d.name}</div>
      <div>Donors touching this node: <b>${d.donor_count}</b></div>
      ${d.merged_from && d.merged_from.length > 1 ? `<div style="margin-top:6px;color:var(--accent);font-size:11px;">Merged from ${d.merged_from.length} raw phrasings:</div>` : ''}
      ${merged}
    </div>`;
}
function showDonorBipartite(d, links, evNodes) {
  const touching = links.filter(l => (l.source.id||l.source) === d.id).map(l => (l.target.id||l.target));
  const names = touching.map(id => (evNodes.find(e => e.id === id) || {}).name).filter(Boolean);
  document.getElementById('inspector-body').innerHTML = `
    <div class="card">
      <div class="pair">${d.name} <span style="color:#8a9189;font-weight:400;">· ${d.donor_id}</span></div>
      <div>RM: <b>${d.rm}</b> · Tier: <b>${d.tier}</b></div>
      <div style="margin-top:6px;">${names.map(n => `<span class="tag">${n}</span>`).join('')}</div>
    </div>`;
}

// ---------- Stage 3 & 4: donor-donor network ----------
let confThreshold = 0.7;

function renderDonorNetwork(showConfidence) {
  const rs = D.stage3_4_routing_confidence[weightMode];
  const { width, height } = bbox();
  clearSvg();
  document.getElementById('weight-toggle').style.display = 'flex';
  document.getElementById('conf-filter').style.display = showConfidence ? 'block' : 'none';

  const cap = document.getElementById('caption');
  if (!showConfidence) {
    cap.className = 'stage-caption' + (weightMode === 'naive' ? ' warn' : '');
    cap.innerHTML = weightMode === 'naive'
      ? `Naive routing: every shared centroid counts equally. <b>${rs.n_routed} / ${rs.candidates_total}</b> candidates route through (τ=${rs.tau}) — nearly everything passes, driven by the "Managing Director" hub.`
      : `Specificity-weighted routing: rare shared concepts count more. <b>${rs.n_routed} / ${rs.candidates_total}</b> candidates route through (τ=${rs.tau}). Edges are binary here — kept or rejected, no ranking yet.`;
  } else {
    cap.className = 'stage-caption';
    cap.innerHTML = `Reconstructed donor network. <b>${rs.n_routed}</b> routed edges, each carrying a calibrated confidence score. Slider below narrows to the strongest connections, like the poster's example.`;
  }

  document.getElementById('stats').innerHTML = `
    <div class="stat-row"><span>Donors</span><span class="val">${D.n_donors}</span></div>
    <div class="stat-row"><span>Candidate pairs</span><span class="val">${rs.candidates_total}</span></div>
    <div class="stat-row"><span>Routed edges</span><span class="val">${rs.n_routed}</span></div>
    <div class="stat-row"><span>τ</span><span class="val">${rs.tau}</span></div>
  `;
  if (!document.querySelector('.inspector .ed-card')) {
    document.getElementById('inspector-body').innerHTML = showConfidence
      ? '<div class="ed-empty">Click an edge to see its Edge Details — from, to, shared evidence, sources, and confidence.</div>'
      : '<div class="placeholder">Click a node or edge for details.</div>';
  }

  const donorIds = Object.keys(D.donors);
  const allNodes = donorIds.map(id => ({ ...D.donors[id], degree: 0 }));
  const idx = new Map(allNodes.map((n, i) => [n.id, i]));
  let allLinks = rs.routed.map(e => ({
    source: e.a, target: e.b, confidence: e.confidence,
    shared: e.shared_centroids, same_rm: e.same_rm, same_tier: e.same_tier, isDup: e.isDup
  }));

  const links = showConfidence ? allLinks.filter(l => l.confidence >= confThreshold) : allLinks;
  links.forEach(l => { allNodes[idx.get(l.source)].degree++; allNodes[idx.get(l.target)].degree++; });
  const nodes = allNodes;

  const container = setupZoom();
  const linkSel = container.append('g').selectAll('line').data(links).join('line')
    .attr('class', d => 'link' + (d.isDup ? ' dup' : ''))
    .attr('stroke', d => 'var(--accent)')
    .attr('stroke-width', d => showConfidence ? 1 + d.confidence * 3 : 1.4)
    .attr('stroke-opacity', d => showConfidence ? 0.4 + d.confidence * 0.5 : 0.5)
    .style('cursor', 'pointer')
    .on('click', (ev, d) => { showEdgeDetails(d); highlightEdge(d); });

  const edgeLabelSel = showConfidence
    ? container.append('g').selectAll('g').data(links).join('g').attr('class', 'edge-label-group')
    : null;
  if (edgeLabelSel) {
    edgeLabelSel.append('text')
      .attr('class', 'edge-label edge-label-conf')
      .attr('text-anchor', 'middle')
      .text(d => d.confidence.toFixed(2));
    edgeLabelSel.append('text')
      .attr('class', 'edge-label edge-label-evidence')
      .attr('text-anchor', 'middle')
      .text(d => evidenceLabel(d));
  }

  const nodeSel = container.append('g').selectAll('g').data(nodes).join('g').attr('class', 'node').call(drag());
  nodeSel.append('circle')
    .attr('r', d => 16 + Math.sqrt(d.degree) * 3)
    .attr('fill', d => donorColor[d.id])
    .attr('fill-opacity', d => showConfidence && d.degree === 0 ? 0.25 : 0.85)
    .attr('stroke', 'var(--ink)').attr('stroke-width', 1.3)
    .attr('stroke-opacity', d => showConfidence && d.degree === 0 ? 0.35 : 1)
    .style('cursor', 'pointer')
    .on('click', (ev, d) => showDonorNode(d, links));

  nodeSel.append('text')
    .attr('text-anchor', 'middle').attr('dy', -2)
    .style('font-weight', 700).style('font-size', '10px')
    .attr('opacity', d => showConfidence && d.degree === 0 ? 0.4 : 1)
    .text(d => d.name.split(' ')[0]);
  nodeSel.append('text')
    .attr('class', 'donor-id')
    .attr('text-anchor', 'middle').attr('dy', 10)
    .attr('opacity', d => showConfidence && d.degree === 0 ? 0.4 : 1)
    .text(d => `(${d.donor_id})`);

  simulation = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(links).id(d => d.id).distance(showConfidence ? 105 : 65).strength(0.4))
    .force('charge', d3.forceManyBody().strength(showConfidence ? -170 : -75))
    .force('center', d3.forceCenter(width / 2, height / 2))
    .force('x', d3.forceX(width / 2).strength(0.04))
    .force('y', d3.forceY(height / 2).strength(0.04))
    .force('collide', d3.forceCollide().radius(d => 22 + Math.sqrt(d.degree) * 2.6))
    .on('tick', () => {
      linkSel.attr('x1', d => d.source.x).attr('y1', d => d.source.y).attr('x2', d => d.target.x).attr('y2', d => d.target.y);
      if (edgeLabelSel) {
        edgeLabelSel.select('.edge-label-conf')
          .attr('x', d => (d.source.x + d.target.x) / 2)
          .attr('y', d => (d.source.y + d.target.y) / 2 - 8);
        edgeLabelSel.select('.edge-label-evidence')
          .attr('x', d => (d.source.x + d.target.x) / 2)
          .attr('y', d => (d.source.y + d.target.y) / 2 + 6);
      }
      nodeSel.attr('transform', d => `translate(${d.x},${d.y})`);
    });

  function highlightEdge(d) {
    linkSel.attr('stroke-opacity', l => l === d ? 1 : (showConfidence ? 0.15 + l.confidence * 0.15 : 0.2))
           .attr('stroke', l => l === d ? 'var(--warn)' : 'var(--accent)');
  }
}

function evidenceLabel(d) {
  // mirrors the poster's under-edge caption, e.g. "Same RM (RM-01)" / "Artist A · Minimalism"
  const parts = [];
  if (d.same_rm) {
    const rm = (D.donors[d.source.id || d.source] || {}).rm;
    parts.push(rm ? `Same RM (${rm})` : 'Same RM');
  }
  const shownConcepts = d.shared.slice(0, 2).join(' · ');
  if (shownConcepts) parts.push(shownConcepts);
  let label = parts.join(' · ');
  if (label.length > 42) label = label.slice(0, 39) + '…';
  return label;
}

function showEdgeDetails(d) {
  const donorA = D.donors[d.source.id || d.source];
  const donorB = D.donors[d.target.id || d.target];
  const evidenceSources = [
    `${d.shared.length} shared concept${d.shared.length !== 1 ? 's' : ''}`,
    d.same_rm ? 'Same relationship manager' : null,
    d.same_tier ? 'Same giving tier' : null,
  ].filter(Boolean);
  const dupNote = d.isDup ? `<div class="ed-field"><div class="k">Flag</div><div class="v" style="color:var(--warn);">Same name — possible duplicate record</div></div>` : '';
  document.getElementById('inspector-body').innerHTML = `
    <div class="ed-card">
      <h3>Edge Details</h3>
      <div class="ed-field"><div class="k">From</div><div class="v">${donorA.name} (${donorA.donor_id})</div></div>
      <div class="ed-field"><div class="k">To</div><div class="v">${donorB.name} (${donorB.donor_id})</div></div>
      <div class="ed-field">
        <div class="k">Shared Evidence</div>
        <ul class="ed-bullets">${d.shared.map(s => `<li>${s}</li>`).join('')}</ul>
      </div>
      <div class="ed-field">
        <div class="k">Evidence Sources</div>
        <ul class="ed-bullets">${evidenceSources.map(s => `<li>${s}</li>`).join('')}</ul>
      </div>
      ${dupNote}
      <div class="ed-field"><div class="k">Confidence</div><div class="ed-conf-val">${d.confidence.toFixed(2)}</div></div>
    </div>`;
}

function showDonorNode(d, links) {
  const touching = links.filter(l => (l.source.id||l.source) === d.id || (l.target.id||l.target) === d.id)
                         .sort((a,b) => b.confidence - a.confidence);
  document.getElementById('inspector-body').innerHTML = `
    <div class="card">
      <div class="pair">${d.name} <span style="color:#8a9189;font-weight:400;">· ${d.donor_id}</span></div>
      <div>RM: <b>${d.rm}</b> · Tier: <b>${d.tier}</b> · Edges: <b>${touching.length}</b></div>
    </div>
    ${touching.slice(0, 6).map(l => `<div class="card"><div class="pair" style="font-size:11px;">${(l.source.name||l.source)} ↔ ${(l.target.name||l.target)}</div><div class="conf" style="font-size:14px;">${l.confidence.toFixed(3)}</div></div>`).join('')}
  `;
}

document.getElementById('conf-slider').oninput = (ev) => {
  confThreshold = parseFloat(ev.target.value);
  document.getElementById('conf-slider-val').textContent = confThreshold.toFixed(2);
  renderDonorNetwork(true);
};

function drag() {
  return d3.drag()
    .on('start', (ev, d) => { if (!ev.active) simulation.alphaTarget(0.2).restart(); d.fx = d.x; d.fy = d.y; })
    .on('drag', (ev, d) => { d.fx = ev.x; d.fy = ev.y; })
    .on('end', (ev, d) => { if (!ev.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; });
}

function render() {
  renderTopbar();
  document.getElementById('inspector-body').innerHTML = '<div class="placeholder">Click a node or edge for details.</div>';
  if (stage === 1) {
    document.getElementById('insp-title').textContent = 'Stage 1 stats';
    renderBipartite('stage1_initial',
      'Raw extraction. Concepts are exact-string deduped only — <b>15</b> distinct concept nodes. Near-synonyms like "Art Fund" / "Arts Funding" / "Art Fundraising" are still separate.');
  } else if (stage === 2) {
    document.getElementById('insp-title').textContent = 'Stage 2 stats';
    const merged = D.stage2_dedup.evidence_nodes.filter(e => e.was_merged).length;
    renderBipartite('stage2_dedup',
      `Warehouse dedup collapses <b>15 → 9</b> nodes. <b>${merged}</b> centroids successfully merged near-duplicates. But "Arts Funding," "Arts Fundraising," and "Public Art Fund Partnership" remain <i>separate</i> centroids — fragmentation survived clustering.`, 'warn');
  } else if (stage === 3) {
    document.getElementById('insp-title').textContent = 'Stage 3 stats';
    renderDonorNetwork(false);
  } else if (stage === 4) {
    document.getElementById('insp-title').textContent = 'Stage 4 stats';
    renderDonorNetwork(true);
  }
}

document.getElementById('btn-naive').onclick = () => { weightMode = 'naive'; document.getElementById('btn-naive').classList.add('active'); document.getElementById('btn-weighted').classList.remove('active'); render(); };
document.getElementById('btn-weighted').onclick = () => { weightMode = 'weighted'; document.getElementById('btn-weighted').classList.add('active'); document.getElementById('btn-naive').classList.remove('active'); render(); };

render();
window.addEventListener('resize', () => render());
</script>
</body>
</html>
